<div class="page-header d-flex justify-content-between align-items-center flex-wrap gap-2">
  <div>
    <h1><i class="bi bi-file-earmark-spreadsheet me-2"></i>{{ q.name }}</h1>
    <div class="text-muted small mt-1">{{ q.customer_name or '화주사 미지정' }} · 생성 {{ q.created_at.strftime('%Y-%m-%d') }}</div>
  </div>
  <div>
    <a class="btn btn-outline-secondary btn-sm" href="{{ url_for('index') }}"><i class="bi bi-arrow-left"></i> 목록</a>
    {% if step == 'result' and result %}
    <a class="btn btn-outline-primary btn-sm" href="{{ url_for('quote_export', qid=q.id) }}"><i class="bi bi-download me-1"></i>견적서 엑셀</a>
    <form class="d-inline" method="post" action="{{ url_for('quote_save_result', qid=q.id) }}">
      <button class="btn btn-primary btn-sm"><i class="bi bi-check2-circle me-1"></i>결과 확정 저장</button>
    </form>
    {% endif %}
  </div>
</div>

<style>
.step-nav { display:flex; gap:0; margin-bottom:1.5rem; background:#fff; border-radius:12px;
            box-shadow:0 2px 12px rgba(30,41,59,.07); overflow:hidden; }
.step-nav a { flex:1; text-align:center; padding:.8rem .5rem; text-decoration:none; color:#64748b;
              font-weight:600; font-size:.92rem; border-bottom:3px solid transparent; }
.step-nav a .num { display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px;
                   border-radius:50%; background:#e2e8f0; color:#64748b; font-size:.78rem; margin-right:6px; }
.step-nav a.active { color:#0d9488; border-bottom-color:#0d9488; background:#f0fdfa; }
.step-nav a.active .num { background:#0d9488; color:#fff; }
.step-nav a.done .num { background:#99f6e4; color:#0f766e; }
</style>
<nav class="step-nav">
  <a href="{{ url_for('quote_data', qid=q.id) }}" class="{% if step=='data' %}active{% elif profile_meta.ship %}done{% endif %}">
    <span class="num">1</span>데이터 · 물동 프로파일</a>
  <a href="{{ url_for('quote_setup', qid=q.id) }}" class="{% if step=='setup' %}active{% endif %}">
    <span class="num">2</span>산정 조건 (흐름·원가·배송)</a>
  <a href="{{ url_for('quote_result', qid=q.id) }}" class="{% if step=='result' %}active{% endif %}">
    <span class="num">3</span>산정 결과</a>
</nav>
